    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#2A95EC" stroke-opacity=".085"/></pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2A95EC" stop-opacity="0"/><stop offset=".5" stop-color="#2A95EC"/><stop offset="1" stop-color="#2A95EC" stop-opacity="0"/></linearGradient>
