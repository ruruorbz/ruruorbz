<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Rowel Orbaneja — Senior Software Engineer and Technical Leader</title>
  <desc id="desc">Deep blue developer identity banner highlighting more than eight years of experience across mobile, web, backend, and cloud systems.</desc>
  <defs>
    <linearGradient id="bg" x1="36" y1="20" x2="1160" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#011D3D"/><stop offset=".52" stop-color="#0A2A52"/><stop offset="1" stop-color="#011D3D"/></linearGradient>
