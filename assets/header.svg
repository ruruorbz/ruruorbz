  <g fill="#2A95EC" fill-opacity=".8"><path d="M52 54h42v5H57v37h-5V54Z"/><path d="M1148 54h-42v5h37v37h5V54Z"/><path d="M52 326h42v-5H57v-37h-5v42Z"/><path d="M1148 326h-42v-5h37v-37h5v42Z"/></g>
